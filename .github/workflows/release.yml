name: Release

"on":
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets NuGet/login exchange an OIDC token for a short-lived push key - no stored secret
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Both installed side by side, same reason as build-test.yml: the test runs on the real 8.0 runtime,
      # not on 10 via roll-forward.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Extract and validate version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not look like a valid version (expected vX.Y.Z or vX.Y.Z-suffix, e.g. v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Never publish a commit that hasn't been verified - the full suite, not the parallel per-provider split
      # build-test.yml uses, since this only runs on a tag push and speed matters less than certainty here.
      - name: Test
        run: dotnet test tests/Forget.Tests/Forget.Tests.csproj

      - name: Pack
        run: dotnet pack Forget.slnx -c Release -p:Version=${{ steps.version.outputs.version }} -o ./artifacts

      # Requested right before the push (not earlier): the exchanged key is only valid for 1 hour.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: davidedalcortivo

      # One `dotnet nuget push` call per .nupkg (each auto-picks up its matching .snupkg from the same folder) -
      # not a single call with a *.nupkg wildcard, which is documented to unreliably skip packages
      # (see NuGet/Home#9867).
      - name: Push to NuGet.org
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  # The GitHub release, written from CHANGELOG.md, once NuGet has the packages. It runs in its own job with its own
  # permission, so the job above keeps read-only access to the repository, and a problem with the notes can never keep
  # a version off NuGet: run the "Release notes" workflow again by hand.
  notes:
    name: GitHub release notes
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ github.ref_name }}